<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar · Aragem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    />
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>
  <body>
    <div class="max-w-3xl mx-auto">
      <article
        class="max-w-xs rounded-lg border border-slate-200 bg-white p-4 flex flex-col gap-3"
      >
        <div>
          <h2 class="font-semibold">Praia do Guincho</h2>
          <p class="text-xs text-slate-500">Cascais · costa</p>
        </div>
        <p class="text-4xl font-bold"><span id="temperatura">--</span>°</p>
        <dl class="grid grid-cols-3 gap-2 text-sm font-mono">
          <div>
            <dt class="font-sans text-[11px] uppercase text-slate-500">
              Vento
            </dt>
            <dd><span id="vento">--</span> km/h</dd>
          </div>
          <div>
            <dt class="font-sans text-[11px] uppercase text-slate-500">
              Direção
            </dt>
            <dd><span id="direcao">--</span>°</dd>
          </div>
          <div>
            <dt class="font-sans text-[11px] uppercase text-slate-500">
              Chuva
            </dt>
            <dd><span id="chuva">--</span> mm</dd>
          </div>
        </dl>
        <p class="text-xs text-slate-500">
          Atualizado: <span id="hora">--</span>
        </p>
      </article>
    </div>

    <script>
      const temperatura = document.getElementById("temperatura");
      const vento = document.getElementById("vento");
      const direcao = document.getElementById("direcao");

      const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=38.73&longitude=-9.47" +
        "&current=temperature_2m,wind_speed_10m,precipitation,wind_direction_10m" +
        "timezone=Europe%2FLisbon";

      async function obterDados() {
        const resposta = await fetch(url);
        const dados = await resposta.json();

        const atual = dados.current;

        temperatura.textContent = atual.temperature_2m;
        vento.textContent = atual.wind_speed_10m;
        direcao.textContent = direcaoVento(atual.wind_direction_10m);

        document.getElementById("hora").textContent = atual.time.slice(11);

        console.log(atual);
      }

      obterDados();

      //setInterval(obterDados, 10000);

      function direcaoVento(graus) {
        const direcoes = ["N", "NE", "E", "SE", "S", "SO", "O", "NO"];
        return direcoes[Math.round(graus / 45) % 8];
      }
    </script>
  </body>
</html>
