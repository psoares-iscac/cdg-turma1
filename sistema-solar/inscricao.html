<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <!-- Codificação de caracteres: permite acentos (á, ç, ã...) -->
  <meta charset="UTF-8">
  <!-- Essencial para o design responsivo: a largura da página = largura do ecrã -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Uma viagem pelos planetas do Sistema Solar.">
  <title>Sistema Solar | Inscrição</title>
  <!-- Ligação à folha de estilos externa -->
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <!-- ===== CABEÇALHO ===== -->
    <header class="cabecalho" id="topo">
    <div class="contentor cabecalho__interior">
        <a href="index.html" class="logo">☀ Sistema Solar</a>

        <!-- Navegação principal -->
        <nav aria-label="Navegação principal">
        <ul class="menu">
            <li><a href="index.html" class="menu__link menu__link--ativo">Início</a></li>
            <li><a href="#planetas" class="menu__link">Planetas</a></li>
            <li><a href="marte.html" class="menu__link">Marte</a></li>
            <li><a href="inscricao.html" class="menu__link">Inscricao</a></li>
        </ul>
        </nav>
    </div>
    </header>

    <main>

        <div class="contentor" style="width:500px;">
            <p class="form-titulo">Formulário de Inscriçao em atividade</p>

            <form action="inscricao.html" method="get">

                <div class="grelha-campos">
                    <div class="campo campo--largo">
                        <label for="insc-nome">Nome Próprio<span class="obrigatorio">*</span></label>
                        <input type="text" id="insc-nome" name="nome" 
                                minlength="3" required
                                placeholder="Ex: Paulo Soares"
                                autocomplete="name"
                        >
                        <small class="ajuda" id="ajuda-nome">Escreve pelo menos 3 carateres.</small>
                    </div>
                    <div class="campo"></div>
                </div>

                <div style="margin-top:2rem">
                    <button type="submit" class="botao">Enviar Inscrição</button>
                </div>


            </form>

        </div>



    </main>
</body>
</html>
